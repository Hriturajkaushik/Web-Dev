<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <label for="Username">Name:</label>
        <input type="text" name="Username" id="Name">

        <br><br>

        <label for="Email">Email:</label>
        <input type="email" name="Email ID" id="Email">

        <br><br>

        <label for="Password">Password:</label>
        <input type="password" name="Password" id="Password">

        <br><br>

        <label for="Date">Date:</label>
        <input type="date" name="Date" id="Date">

        <br><br>

        <label for="Time">Time</label>
        <input type="time" name="Time" id="Time">

        <br><br>

        <label for="Gender">Gender:</label>
        <input type="radio" name="Gender" id="Male" value="Male">
        Male
        <input type="radio" name="Gender" id="Female" value="Female">
        Female
        <input type="radio" name="Gender" id="N/A">
        Prefer Not to say
        <!-- All the three options belong to the same name group so if we select one option the other will be automatically be deselect -->

        <br><br>

        <label for="Options">A</label>
        <input type="checkbox" name="Option" id="Option">
        <br>
        <label for="Options">B</label>
        <input type="checkbox" name="Option" id="Option">
        <br>
        <label for="Options">C</label>
        <input type="checkbox" name="Option" id="Option">
        <br>
        <label for="Options">D</label>
        <input type="checkbox" name="Option" id="Option">
        <br>
        <label for="Options">E</label>
        <input type="checkbox" name="Option" id="Option">

        <br><br>

        <label for="File">Upload File</label>
        <input type="file" name="File" id="file">

        <br><br>

        <label for="Volume">Volume</label>
        <input type="range" name="volume" id="volume">

        <br><br>

        <label for="Color">Color</label>
        <input type="color" name="color" id="color">

        <br><br>

        <button> <abbr title="Submit the form">Submit</abbr></button>

        <br><br>
          <label for="Comment">Comment</label>
        <textarea name="Comment" id="Comment" rows="10" cols="20"></textarea>

        <br><br>
         
        <label for="Country">Country</label>
        <select name="Country" id="Country">
            <option value="country"> INDIA</option>
            <option value="country"> INDONESIA</option>
            <option value="country"> USA</option>
            <option value="country"> CANADA</option>
            <option value="country"> FRANCE</option>
            <option value="country"> GERMANY</option>
        </select>

        
    </form>
</body>

</html>
